name: scheduler

# Drives the campaign scheduler by pinging the deployed /api/tick every 15
# minutes. Used instead of Vercel Cron because the Vercel Hobby plan only allows
# once-daily cron jobs. Requires two repository secrets:
#   TICK_URL     e.g. https://outreach-engine-steel.vercel.app/api/tick
#   CRON_SECRET  same value set as CRON_SECRET in the Vercel project
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Avoid overlapping ticks if one run is slow.
concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Fire scheduler tick
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$TICK_URL" ]; then echo "TICK_URL secret not set"; exit 1; fi
          curl -fsS -X POST "$TICK_URL" -H "Authorization: Bearer $CRON_SECRET"
